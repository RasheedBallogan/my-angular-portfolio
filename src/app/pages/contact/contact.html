<div class="contact-section">
  <h1 class="contact-title">Get in Touch</h1>
  <p class="contact-subtitle">Feel free to reach out for collaborations, questions, or just to say hello!</p>

  <form class="contact-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your Name">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Type your message here..."></textarea>
    </div>

    <button type="submit" class="btn-send">Send Message</button>
  </form>

  <div class="contact-info">
    <p><strong>Location:</strong> Baguio City, Philippines</p>
    <p><strong>Email:</strong> rasheed@example.com</p>
  </div>
</div>
